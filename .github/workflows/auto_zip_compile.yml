name: Upload ZIP - Build STM32 Firmware

on:
  push:
    paths:
      - "STM32_Firmware.zip"
      - ".github/workflows/auto_zip_compile.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Initialize Arduino CLI
        shell: bash
        run: |
          set -euo pipefail
          arduino-cli config init

      - name: Register STM32 Board Package
        shell: bash
        run: |
          set -euo pipefail

          URL="https://github.com/stm32duino/BoardManagerFiles/raw/main/package_stmicroelectronics_index.json"

          arduino-cli config add board_manager.additional_urls "$URL"

          arduino-cli config dump

      - name: Update Arduino Package Indexes
